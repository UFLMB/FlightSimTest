name: Build and deploy native Flight Simulator
on:
  push:
    branches: ["main", "native-threejs-rebuild", "civil-mobile-controls", "gyro-living-world", "realism-instruments-camera-phase5", "weather-presets-atmosphere-phase6", "airport-ground-operations-phase7", "real-aircraft-model-phase8", "pbr-airport-surfaces-phase9"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run flight model and terrain tests
        run: npm test
      - name: Build native WebGL simulator
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
